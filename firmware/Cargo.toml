[package]
name = "oxrok-firmware-fetch"
description = "Fetches the vendor firmware oxrok's drivers need: downloads it, or takes the user's copy, and extracts it on the user's machine"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/oxrok/oxrok-util"
authors = ["Miguel Angel Ajo <mangel.ajo@gmail.com>"]
keywords = ["sigrok", "firmware", "logic-analyzer"]
categories = ["hardware-support"]

[features]
default = ["download"]
# Fetching over HTTPS. Without it the registry, the extractors and
# importing the user's own files still work.
download = ["dep:ureq", "dep:rustls", "dep:rustls-native-certs"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"

[dependencies]
deflate64 = "0.1.12"
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
log = "0.4"
md-5 = "0.10"
object = { version = "0.41.0", default-features = false, features = ["read", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
sha2 = "0.10"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider"], optional = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2", "deflate64"] }
